<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    This is the navigation bar fragment.
    It can be included in other pages using th:replace.
    e.g. <div th:replace="~{fragments/navigation :: navbar}"></div>
*/-->
<nav class="bg-gray-800 shadow-md" th:fragment="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <a class="text-white font-bold text-xl" th:href="@{/}">Admin Panel</a>
                </div>

                    <div class="ml-10 flex items-baseline space-x-4">
                        <a class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium"
                           th:href="@{/}">Dashboard</a>
                        <a class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium"
                           th:href="@{/products/list}">Products</a>
                        <a class="text-gray-300 hover:bg-gray-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium"
                           th:href="@{/orders/list}">Orders</a>
