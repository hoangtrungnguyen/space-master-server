<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: common_header(titleKey='product.add.title')}"></head>

<body class="bg-gray-100">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-gray-800" th:text="#{product.add.title}">Add a New Product</h1>
        <!-- Success Message -->
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4"
             role="alert"
             th:if="${successMessage}">
            <span class="block sm:inline" th:text="${successMessage}"></span>
        </div>

        <!-- The form now binds to the 'productForm' DTO -->
        <form class="space-y-6" method="post" th:action="@{/products/add}" th:object="${productForm}">
            <!-- Product Fields -->
            <div>
                <label class="block text-sm font-medium text-gray-700" for="name" th:text="#{product.name}">Product
                    Name:</label>
                <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       id="name" required
                       th:field="*{name}"
                       type="text"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700" for="description"
                       th:text="#{product.description}">Description:</label>
                <textarea
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        id="description"
                        required
                        rows="3"
                        th:field="*{description}"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700" for="brandId"
                       th:text="#{product.brand}">Brand:</label>
                <select class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        id="brandId" required
                        th:field="*{brandId}">
                    <option th:text="#{product.select_brand}" value="">-- Select a Brand --</option>
                    <option th:each="brand : ${allBrands}" th:text="${brand.name}" th:value="${brand.id}"></option>
                </select>
                <div class="mt-2 text-sm">
                    <a class="font-medium text-indigo-600 hover:text-indigo-500"
                       href="#" id="add-brand-link" th:text="#{product.add_new_brand}">
                        + Add a new brand
                    </a>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700" for="categoryId" th:text="#{product.category}">Category:</label>
                <select class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        id="categoryId" required
                        th:field="*{categoryId}">
                    <option th:text="#{product.select_category}" value="">-- Select a Category --</option>
                    <option th:each="cat : ${allCategories}" th:text="${cat.name}" th:value="${cat.id}"></option>
                </select>
                <div class="mt-2 text-sm">
                    <a class="font-medium text-indigo-600 hover:text-indigo-500" href="#" id="add-category-link"
                       th:text="#{product.add_new_category}">+ Add a new category</a>
                </div>
            </div>

            <hr class="my-4">
            <h2 class="text-xl font-semibold text-gray-700" th:text="#{product.variant_details}">Initial Variant</h2>

            <!-- Product Variant Fields -->
            <div>
                <label class="block text-sm font-medium text-gray-700" for="sku" th:text="#{product.sku}">SKU
                    (Barcode):</label>
                <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       id="sku" required
                       th:field="*{sku}"
                       type="text"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700" for="price"
                       th:text="#{product.price}">Price:</label>
                <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       id="price" required step="0.01"
                       th:field="*{price}"
                       type="number"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700" for="costPrice" th:text="#{product.cost_price}">Cost
                    Price:</label>
                <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       id="costPrice" required step="0.01" th:field="*{costPrice}" type="number"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700" for="weight"
                       th:text="#{product.weight}">Weight:</label>
                <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       id="weight" required step="0.01" th:field="*{weight}" type="number"/>
            </div>

            <div>
                <button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                        th:text="#{button.save}" type="submit">
                    Save Product
                </button>
            </div>
        </form>
        <div class="mt-4 text-center">
            <a class="font-medium text-indigo-600 hover:text-indigo-500" th:href="@{/products/list}"
               th:text="#{product.back_to_list}">Back to Product
                List</a>
        </div>
    </div>

    <script>
        function buildReturnUrlWithParams(baseUrl) {
            const form = document.querySelector('form');
            const formData = new FormData(form);
            const params = new URLSearchParams();

            // We only care about the product form fields, not the IDs
            const fieldsToPreserve = ['name', 'description', 'brandId', 'categoryId', 'sku', 'price', 'costPrice', 'weight'];

            for (const [key, value] of formData.entries()) {
                if (fieldsToPreserve.includes(key) && value) {
                    params.append(key, value);
                }
            }

            const returnUrl = `/products/add?${params.toString()}`;
            return `${baseUrl}?returnUrl=${encodeURIComponent(returnUrl)}`;
        }

        document.getElementById('add-brand-link').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = buildReturnUrlWithParams('/brands/add');
        });

        document.getElementById('add-category-link').addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = buildReturnUrlWithParams('/categories/add');
        });
    </script>
</div>
</body>
</html>
