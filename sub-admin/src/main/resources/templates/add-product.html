<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">
<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Add a New Product</h1>
    <!-- The form will submit a POST request to /products/add -->
    <!-- th:object binds this form to the 'product' object from the model -->
    <form class="space-y-6" method="post" th:action="@{/products/add}" th:object="${product}">
        <div>
            <label class="block text-sm font-medium text-gray-700" for="name">Product Name:</label>
            <!-- th:field links this input to the 'name' property of the product object -->
            <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" id="name" required
                   th:field="*{name}"
                   type="text"/>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700" for="price">Price:</label>
            <!-- th:field links this input to the 'price' property of the product object -->
            <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" id="price" required step="0.01"
                   th:field="*{price}"
                   type="number"/>
        </div>
        <div>
            <button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                    type="submit">
                Save Product
            </button>
        </div>
    </form>
    <div class="mt-4 text-center">
        <a class="font-medium text-indigo-600 hover:text-indigo-500" th:href="@{/products/list}">View All Products</a>
    </div>
</div>
</body>
</html>
