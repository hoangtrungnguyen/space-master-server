<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: common_header(titleKey='category.add.title')}"></head>

<body class="bg-gray-100">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Left Column: Add Category Form -->
    <div>
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md mx-auto md:mx-0">
            <h1 class="text-2xl font-bold mb-6 text-gray-800" th:text="#{category.add.title}">Add a New Category</h1>
            <form class="space-y-6" method="post" th:action="@{/categories/add}" th:object="${categoryForm}">
                <input name="returnUrl" th:if="${returnUrl}" th:value="${returnUrl}" type="hidden"/>
                <div>
                    <label class="block text-sm font-medium text-gray-700" for="name" th:text="#{category.name}">Category
                        Name:</label>
                    <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                           id="name" required
                           th:field="*{name}"
                           type="text"/>
                </div>

                <div>
                    <button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                            th:text="#{button.save}"
                            type="submit">Save Category
                    </button>
                </div>
            </form>
            <div class="mt-4 text-center">
                <a class="font-medium text-indigo-600 hover:text-indigo-500" th:href="${returnUrl} ?: @{/products/list}"
                   th:text="#{button.back}">Back</a>
            </div>
        </div>
    </div>

    <!-- Right Column: List of Categories -->
    <div>
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md mx-auto md:mx-0">
            <h2 class="text-2xl font-bold mb-6 text-gray-800" th:text="#{category.existing}">Existing Categories</h2>
            <div class="text-gray-600" th:if="${allCategories.isEmpty()}" th:text="#{category.none}">
                No categories added yet.
            </div>
            <ul class="list-disc list-inside space-y-2" th:unless="${allCategories.isEmpty()}">
                <li class="text-gray-700" th:each="category : ${allCategories}">
                    <span th:text="${category.name}">Category Name</span>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
