<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: common_header(titleKey='product.variant.add.title')}"></head>

<body class="bg-gray-100">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-gray-800" th:text="#{product.variant.add.title}">Add a New Product Variant</h1>

        <!-- Success Message -->
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative mb-4"
             role="alert"
             th:if="${successMessage}">
            <span class="block sm:inline" th:text="${successMessage}"></span>
        </div>

        <form class="space-y-6" method="post" th:action="@{/product-variants/add}" th:object="${variantForm}">
            <!-- Parent Product Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700" for="productId" th:text="#{product.parent}">Parent Product:</label>
                <select class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                        id="productId" required
                        th:field="*{productId}">
                    <option th:text="#{product.select_product}" value="">-- Select a Product --</option>
                    <option th:each="product : ${products}" th:text="${product.name}" th:value="${product.id}"></option>
                </select>
            </div>

            <!-- Product Variant Fields (Initially Hidden) -->
            <div id="variant-form-fields" style="display: none;" class="space-y-6">
                <hr class="my-4">

                <div>
                    <label class="block text-sm font-medium text-gray-700" for="sku" th:text="#{product.sku}">SKU (Barcode):</label>
                    <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                           id="sku" required
                           th:field="*{sku}"
                           type="text"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700" for="price" th:text="#{product.price}">Price:</label>
                    <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                           id="price" required step="0.01"
                           th:field="*{price}"
                           type="number"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700" for="costPrice" th:text="#{product.cost_price}">Cost Price:</label>
                    <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                           id="costPrice" required step="0.01" th:field="*{costPrice}" type="number"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700" for="weight" th:text="#{product.weight}">Weight:</label>
                    <input class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                           id="weight" required step="0.01" th:field="*{weight}" type="number"/>
                </div>

                <div>
                    <button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                            th:text="#{button.save_variant}" type="submit">
                        Save Variant
                    </button>
                </div>
            </div>
        </form>
        <div class="mt-4 text-center">
            <a class="font-medium text-indigo-600 hover:text-indigo-500" th:href="@{/products/list}"
               th:text="#{product.back_to_list}">Back to Product List</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const productSelect = document.getElementById('productId');
        const variantFields = document.getElementById('variant-form-fields');

        function toggleVariantFields() {
            if (productSelect.value) {
                variantFields.style.display = 'block';
            } else {
                variantFields.style.display = 'none';
            }
        }

        // Check on page load in case a product is already selected (e.g., form validation failure)
        toggleVariantFields();

        productSelect.addEventListener('change', toggleVariantFields);
    });
</script>

</body>
</html>
