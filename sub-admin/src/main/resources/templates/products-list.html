<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: common_header(titleKey='product.list.title')}"></head>

<body class="bg-gray-100">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800" th:text="#{product.list.title}">Products</h1>
        <a class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300"
           th:href="@{/products/add}" th:text="#{nav.add_product}">
            Add New Product
        </a>
    </div>

    <div class="bg-white shadow-lg rounded-lg overflow-hidden">
        <table class="min-w-full leading-normal">
            <thead>
            <tr>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    th:text="#{product.name}">
                    Product Name
                </th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    th:text="#{product.brand}">
                    Brand
                </th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    th:text="#{product.category}">
                    Category
                </th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider"
                    th:text="#{product.sku}">
                    SKU
                </th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50"></th>
            </tr>
            </thead>
            <tbody>
            <tr class="hover:bg-gray-50" th:each="product : ${products}">
                <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm">
                    <p class="text-gray-900 whitespace-no-wrap" th:text="${product.name}">Product Name</p>
                </td>
                <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm">
                    <p class="text-gray-900 whitespace-no-wrap" th:text="${product.brandName} ?: 'N/A'">N/A</p>
                </td>
                <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm">
                    <p class="text-gray-900 whitespace-no-wrap" th:text="${product.categoryName} ?: 'N/A'">N/A</p>
                </td>
                <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm">
                    <p class="text-gray-600 whitespace-no-wrap"
                       th:text="${product.firstVariantSku} ?: 'N/A'">SKU-123</p>
                </td>
                <td class="px-5 py-4 border-b border-gray-200 bg-white text-sm text-right">
                    <a class="text-indigo-600 hover:text-indigo-900 font-medium"
                       th:href="@{/products/edit/{id}(id=${product.id})}" th:text="#{button.edit.title}">Edit</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
