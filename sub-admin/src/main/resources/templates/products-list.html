<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common_header(titleKey='product.list.title')}"></head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Products</h1>
        <a th:href="@{/products/add}" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-full transition duration-300 ease-in-out">
            Add New Product
        </a>
    </div>

    <div class="bg-white shadow-md rounded-lg overflow-hidden">
        <table class="min-w-full leading-normal">
            <thead>
            <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                <th class="py-3 px-6 text-left">Product Name</th>
                <th class="py-3 px-6 text-left">SKU</th>
                <th class="py-3 px-6 text-left">Brand</th>
                <th class="py-3 px-6 text-left">Category</th>
                <th class="py-3 px-6 text-right">Quantity on Hand</th>
                <th class="py-3 px-6 text-center">Status</th>
                <th class="py-3 px-6 text-center">Actions</th>
            </tr>
            </thead>
            <tbody class="text-gray-600 text-sm font-light">
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="7" class="text-center py-4 text-gray-500 italic">No products found.</td>
            </tr>
            <tr class="border-b border-gray-200 hover:bg-gray-100" th:each="item : ${products}">
                <td class="py-3 px-6 text-left" th:text="${item.productName}"></td>
                <td class="py-3 px-6 text-left font-mono" th:text="${item.variantSku}"></td>
                <td class="py-3 px-6 text-left" th:text="${item.brandName ?: 'N/A'}"></td>
                <td class="py-3 px-6 text-left" th:text="${item.categoryName ?: 'N/A'}"></td>
                <td class="py-3 px-6 text-right font-semibold"
                    th:classappend="${item.quantityOnHand == null || item.quantityOnHand == 0} ? 'text-gray-400' : 'text-blue-600'">
                    <span th:text="${item.quantityOnHand ?: 'N/A'}"></span>
                </td>
                <td class="py-3 px-6 text-center">
                    <span th:if="${item.isActive}" class="px-2 py-1 text-xs font-semibold text-green-800 bg-green-200 rounded-full">Active</span>
                    <span th:unless="${item.isActive}" class="px-2 py-1 text-xs font-semibold text-red-800 bg-red-200 rounded-full">Inactive</span>
                </td>
                <td class="py-3 px-6 text-center">
                    <a th:href="@{/products/{id}(id=${item.productId}, variantId=${item.variantId})}" class="text-indigo-600 hover:text-indigo-900">View Details</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
