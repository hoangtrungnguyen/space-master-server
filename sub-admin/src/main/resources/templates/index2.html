<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Performance Dashboard</title>
    <!-- 1. Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Chart.js via CDN for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 3. Chart.js Date Adapter (date-fns) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <!-- 4. Inter font family (common with Tailwind) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Apply the Inter font family */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 antialiased">

<!-- Main Container -->
<div class="container mx-auto p-4 md:p-8">

    <!-- Header -->
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-800">Sales Performance Dashboard</h1>
        <!-- Date Range Selector -->
        <div>
            <label for="dateRange" class="text-sm font-medium text-gray-600 mr-2">Period:</label>
            <select id="dateRange" name="dateRange" class="mt-1 block w-full sm:w-auto pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md shadow-sm">
                <option value="30">Last 30 Days</option>
                <option value="90" selected>Last 90 Days</option>
                <option value="180">Last 6 Months</option>
                <option value="365">Last Year</option>
            </select>
        </div>
    </header>

    <!-- KPI Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Card 1: Revenue Growth Rate -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-sm font-medium text-gray-500 uppercase">Revenue</p>
                    <p id="kpi-revenue" class="text-3xl font-bold text-gray-800 mt-2">$0.00</p>
                </div>
                <!-- Icon -->
                <div class="bg-indigo-100 text-indigo-600 rounded-full p-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.105 0 2 .895 2 2s-.895 2-2 2-2-.895-2-2 .895-2 2 2zm0 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.105 0 2 .895 2 2s-.895 2-2 2-2-.895-2-2 .895-2 2 2z"></path></svg>
                </div>
            </div>
            <div class="mt-4 flex items-baseline">
                <span id="kpi-revenue-growth" class="text-2xl font-semibold text-green-600">0.0%</span>
                <span class="ml-2 text-sm text-gray-500">vs. previous period</span>
            </div>
        </div>

        <!-- Card 2: Profit Margin -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-sm font-medium text-gray-500 uppercase">Profit Margin</p>
                    <p id="kpi-profit-margin" class="text-3xl font-bold text-gray-800 mt-2">0.0%</p>
                </div>
                <!-- Icon -->
                <div class="bg-green-100 text-green-600 rounded-full p-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
            </div>
            <div class="mt-4 flex items-baseline">
                <span id="kpi-profit-margin-change" class="text-2xl font-semibold text-red-600">0.0 pts</span>
                <span class="ml-2 text-sm text-gray-500">vs. previous period</span>
            </div>
        </div>

        <!-- Card 3: Number of Transactions -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-start">
                <div>
                    <p class="text-sm font-medium text-gray-500 uppercase">Transactions</p>
                    <p id="kpi-transactions" class="text-3xl font-bold text-gray-800 mt-2">0</p>
                </div>
                <!-- Icon -->
                <div class="bg-blue-100 text-blue-600 rounded-full p-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
            </div>
            <div class="mt-4 flex items-baseline">
                <span id="kpi-transactions-change" class="text-2xl font-semibold text-green-600">0.0%</span>
                <span class="ml-2 text-sm text-gray-500">vs. previous period</span>
            </div>
        </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6 mt-8">

        <!-- Chart 1: Revenue & Profit Margin Over Time (Line Chart) -->
        <div class="lg:col-span-3 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Revenue & Profit Margin</h2>
            <div class="h-80">
                <canvas id="revenueProfitChart"></canvas>
            </div>
        </div>

        <!-- Chart 2: Transactions Over Time (Bar Chart) -->
        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Transactions</h2>
            <div class="h-80">
                <canvas id="transactionsChart"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Section -->
<script>
    // --- GLOBAL VARIABLES ---
    let allMockData = [];
    let revenueProfitChartInstance = null;
    let transactionsChartInstance = null;

    // --- MOCK DATA GENERATION ---
    // Generates realistic-looking mock transaction data for the past year
    function generateMockData() {
        const data = [];
        const today = new Date();
        for (let i = 365; i >= 0; i--) {
            const date = new Date(today);
            date.setDate(today.getDate() - i);
            const dayStr = date.toISOString().split('T')[0];

            // Simulate weekend dips and weekday peaks
            const dayOfWeek = date.getDay();
            let transactionsCount = 0;
            if (dayOfWeek === 0 || dayOfWeek === 6) { // Weekend
                transactionsCount = Math.floor(Math.random() * 20) + 10; // 10-30
            } else { // Weekday
                transactionsCount = Math.floor(Math.random() * 40) + 20; // 20-60
            }

            for (let j = 0; j < transactionsCount; j++) {
                const revenue = Math.random() * 150 + 50; // $50 - $200
                // COGS is 50-70% of revenue
                const cogs = revenue * (Math.random() * 0.2 + 0.5);
                data.push({
                    date: dayStr,
                    revenue: revenue,
                    cogs: cogs
                });
            }
        }
        return data;
    }

    // --- HELPER FUNCTIONS ---

    /**
     * Filters data between a start and end date (inclusive of start, exclusive of end)
     * @param {Date} startDate - The start date
     * @param {number} days - The number of days to filter for
     * @returns {Array} - Filtered data
     */
    function filterDataByDays(startDate, days) {
        const endDate = new Date(startDate);
        endDate.setDate(startDate.getDate() - days);
        const startStr = startDate.toISOString().split('T')[0];
        const endStr = endDate.toISOString().split('T')[0];

        return allMockData.filter(d => d.date >= endStr && d.date < startStr);
    }

    /**
     * Calculates key metrics from a given dataset
     * @param {Array} data - An array of transaction objects
     * @returns {Object} - An object containing totalRevenue, totalCogs, and transactionCount
     */
    function calculateMetrics(data) {
        return data.reduce((acc, curr) => {
            acc.totalRevenue += curr.revenue;
            acc.totalCogs += curr.cogs;
            return acc;
        }, {
            totalRevenue: 0,
            totalCogs: 0,
            transactionCount: data.length
        });
    }

    /**
     * Calculates the profit margin percentage
     * @param {number} revenue - Total revenue
     * @param {number} cogs - Total cost of goods sold
     * @returns {number} - Profit margin percentage
     */
    function calculateProfitMargin(revenue, cogs) {
        if (revenue === 0) return 0;
        return ((revenue - cogs) / revenue) * 100;
    }

    /**
     * Calculates the percentage growth
     * @param {number} current - The current period's value
     * @param {number} previous - The previous period's value
     * @returns {number} - Growth percentage
     */
    function calculateGrowth(current, previous) {
        if (previous === 0) {
            return current > 0 ? 100.0 : 0.0; // Handle division by zero
        }
        return ((current - previous) / previous) * 100;
    }

    /**
     * Formats a number as USD currency
     * @param {number} number - The number to format
     * @returns {string} - Formatted currency string
     */
    function formatCurrency(number) {
        return new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 2
        }).format(number);
    }

    /**
     * Formats a number as a percentage
     * @param {number} number - The number to format
     * @returns {string} - Formatted percentage string
     */
    function formatPercent(number) {
        return number.toFixed(1) + '%';
    }

    /**
     * Updates a KPI change element with color and text
     * @param {HTMLElement} element - The DOM element to update
     * @param {number} value - The change value
     * @param {string} unit - The unit (e.g., '%', ' pts')
     */
    function updateChangeElement(element, value, unit) {
        const formattedValue = value.toFixed(1);
        element.textContent = `${value >= 0 ? '+' : ''}${formattedValue}${unit}`;

        // Remove old color classes
        element.classList.remove('text-green-600', 'text-red-600', 'text-gray-600');

        // Add new color class
        if (value > 0) {
            element.classList.add('text-green-600');
        } else if (value < 0) {
            element.classList.add('text-red-600');
        } else {
            element.classList.add('text-gray-600');
        }
    }

    /**
     * Groups data by period (day, week, or month)
     * @param {Array} data - The transaction data
     * @param {string} period - 'day', 'week', or 'month'
     * @returns {Object} - Data grouped by date string
     */
    function groupDataByPeriod(data, period) {
        const grouped = {};

        data.forEach(item => {
            const date = new Date(item.date);
            let key;

            if (period === 'day') {
                key = item.date;
            } else if (period === 'week') {
                // Use date-fns logic if available, otherwise fallback
                const day = date.getDay();
                const diff = date.getDate() - day + (day === 0 ? -6 : 1); // adjust when day is sunday
                const firstDayOfWeek = new Date(date.setDate(diff));
                key = firstDayOfWeek.toISOString().split('T')[0];

            } else { // month
                key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-01`;
            }

            if (!grouped[key]) {
                grouped[key] = {
                    date: key,
                    revenue: 0,
                    cogs: 0,
                    transactions: 0
                };
            }
            grouped[key].revenue += item.revenue;
            grouped[key].cogs += item.cogs;
            grouped[key].transactions += 1;
        });

        // Sort by date and convert back to array
        return Object.values(grouped).sort((a, b) => new Date(a.date) - new Date(b.date));
    }


    // --- MAIN DASHBOARD UPDATE FUNCTION ---
    function updateDashboard(days = 90) {
        const today = new Date();

        // 1. Get data for current and previous periods
        const currentPeriodData = filterDataByDays(today, days);
        const previousPeriodStartDate = new Date(today);
        previousPeriodStartDate.setDate(today.getDate() - days);
        const previousPeriodData = filterDataByDays(previousPeriodStartDate, days);

        // 2. Calculate metrics for both periods
        const currentMetrics = calculateMetrics(currentPeriodData);
        const previousMetrics = calculateMetrics(previousPeriodData);

        const currentProfitMargin = calculateProfitMargin(currentMetrics.totalRevenue, currentMetrics.totalCogs);
        const previousProfitMargin = calculateProfitMargin(previousMetrics.totalRevenue, previousMetrics.totalCogs);

        // 3. Calculate growth/change
        const revenueGrowth = calculateGrowth(currentMetrics.totalRevenue, previousMetrics.totalRevenue);
        const profitMarginChange = currentProfitMargin - previousProfitMargin; // Absolute point change
        const transactionGrowth = calculateGrowth(currentMetrics.transactionCount, previousMetrics.transactionCount);

        // 4. Update KPI Cards
        document.getElementById('kpi-revenue').textContent = formatCurrency(currentMetrics.totalRevenue);
        updateChangeElement(document.getElementById('kpi-revenue-growth'), revenueGrowth, '%');

        document.getElementById('kpi-profit-margin').textContent = formatPercent(currentProfitMargin);
        updateChangeElement(document.getElementById('kpi-profit-margin-change'), profitMarginChange, ' pts');

        document.getElementById('kpi-transactions').textContent = new Intl.NumberFormat().format(currentMetrics.transactionCount);
        updateChangeElement(document.getElementById('kpi-transactions-change'), transactionGrowth, '%');

        // 5. Update Charts
        updateCharts(currentPeriodData, days);
    }

    // --- CHARTING FUNCTIONS ---
    function updateCharts(data, days) {
        // Determine grouping period
        let period = 'day';
        let unit = 'day';
        if (days > 90) {
            period = 'week';
            unit = 'week';
        }
        if (days > 365) { // This won't be hit with current options, but good for extension
            period = 'month';
            unit = 'month';
        }

        const groupedData = groupDataByPeriod(data, period);
        const labels = groupedData.map(d => d.date);
        const revenueData = groupedData.map(d => d.revenue);
        const transactionData = groupedData.map(d => d.transactions);
        const profitMarginData = groupedData.map(d => calculateProfitMargin(d.revenue, d.cogs));

        // --- Chart 1: Revenue & Profit Margin (Line Chart) ---
        const ctxRevenue = document.getElementById('revenueProfitChart').getContext('2d');
        if (revenueProfitChartInstance) {
            revenueProfitChartInstance.destroy();
        }
        revenueProfitChartInstance = new Chart(ctxRevenue, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Revenue',
                        data: revenueData,
                        borderColor: 'rgb(79, 70, 229)', // indigo-600
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        yAxisID: 'yRevenue',
                        tension: 0.1
                    },
                    {
                        label: 'Profit Margin',
                        data: profitMarginData,
                        borderColor: 'rgb(22, 163, 74)', // green-600
                        backgroundColor: 'transparent',
                        yAxisID: 'yProfit',
                        tension: 0.1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: unit,
                            tooltipFormat: 'MMM dd, yyyy' // e.g., Nov 17, 2025
                        },
                        grid: {
                            display: false
                        },
                        ticks: {
                            major: {
                                enabled: true
                            }
                        }
                    },
                    yRevenue: {
                        type: 'linear',
                        position: 'left',
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                if (value >= 1000) return '$' + (value / 1000) + 'k';
                                return '$' + value;
                            }
                        }
                    },
                    yProfit: {
                        type: 'linear',
                        position: 'right',
                        beginAtZero: true,
                        max: 100,
                        grid: {
                            drawOnChartArea: false, // Only draw grid for revenue axis
                        },
                        ticks: {
                            callback: function(value) {
                                return value + '%';
                            }
                        }
                    }
                },
                plugins: {
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    if (context.dataset.yAxisID === 'yProfit') {
                                        label += context.parsed.y.toFixed(1) + '%';
                                    } else {
                                        label += formatCurrency(context.parsed.y);
                                    }
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });

        // --- Chart 2: Transactions (Bar Chart) ---
        const ctxTransactions = document.getElementById('transactionsChart').getContext('2d');
        if (transactionsChartInstance) {
            transactionsChartInstance.destroy();
        }
        transactionsChartInstance = new Chart(ctxTransactions, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Transactions',
                        data: transactionData,
                        backgroundColor: 'rgba(37, 99, 235, 0.8)', // blue-600
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: unit,
                            tooltipFormat: 'MMM dd, yyyy'
                        },
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        beginAtZero: true
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += context.parsed.y;
                                }
                                return label;
                            }
                        }
                    }
                }
            }
        });
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Generate the base data
        allMockData = generateMockData();

        // 2. Add event listener for the date range selector
        const dateRangeSelector = document.getElementById('dateRange');
        dateRangeSelector.addEventListener('change', (e) => {
            updateDashboard(Number(e.target.value));
        });

        // 3. Initial load
        updateDashboard(Number(dateRangeSelector.value));
    });

</script>
</body>
</html>
