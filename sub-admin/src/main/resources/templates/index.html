<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md mx-auto text-center">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">Admin Dashboard</h1>
        <div class="space-y-4">
            <a class="block w-full text-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
               th:href="@{/products/list}">
                Manage Products
            </a>
            <a class="block w-full text-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
               th:href="@{/orders/list}">
                View Orders
            </a>
        </div>
    </div>
</div>
</body>
</html>
