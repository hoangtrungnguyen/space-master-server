<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/header :: common_header(titleKey='dashboard.title')}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.0"></script>
</head>

<body class="bg-gray-100">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">
    <h1 class="text-3xl font-bold mb-6 text-gray-800" th:text="#{dashboard.title}">Admin Dashboard</h1>

    <!-- Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-sm font-medium text-gray-500">Total Revenue (Last 30d)</h2>
            <p class="text-3xl font-semibold text-gray-800"
               th:text="'$' + ${#numbers.formatDecimal(dashboardData.totalRevenue, 1, 'COMMA', 2, 'POINT')}">
                $0.00</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-sm font-medium text-gray-500">Total Orders (Last 30d)</h2>
            <p class="text-3xl font-semibold text-gray-800" th:text="${dashboardData.totalOrders}">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-sm font-medium text-gray-500">Avg. Order Value (Last 30d)</h2>
            <p class="text-3xl font-semibold text-gray-800"
               th:text="'$' + ${#numbers.formatDecimal(dashboardData.averageOrderValue, 1, 'COMMA', 2, 'POINT')}">
                $0.00</p>
        </div>
    </div>

    <!-- Charts and Top Products -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Revenue Trend (Last 30 Days)</h2>
            <canvas id="revenueChart"></canvas>
        </div>
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Top Selling Products</h2>
            <ul class="space-y-4">
                <li class="flex justify-between items-center" th:each="product : ${dashboardData.topSellingProducts}">
                    <div>
                        <p class="font-medium text-gray-800" th:text="${product.productName}">Product Name</p>
                        <p class="text-sm text-gray-500" th:text="${product.totalQuantity} + ' units sold'">0 units
                            sold</p>
                    </div>
                    <p class="font-semibold text-green-600"
                       th:text="'$' + ${#numbers.formatDecimal(product.totalRevenue, 1, 'COMMA', 2, 'POINT')}">$0.00</p>
                </li>
                <li th:if="${#lists.isEmpty(dashboardData.topSellingProducts)}">
                    <p class="text-gray-500">No sales data available.</p>
                </li>
            </ul>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const revenueData = /*[[${dashboardData.revenueTrend}]]*/ {};
    const labels = Object.keys(revenueData);
    const dataPoints = Object.values(revenueData);

    const ctx = document.getElementById('revenueChart').getContext('2d');
    const revenueChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Daily Revenue',
                data: dataPoints,
                backgroundColor: 'rgba(79, 70, 229, 0.1)',
                borderColor: 'rgba(79, 70, 229, 1)',
                borderWidth: 2,
                tension: 0.3,
                fill: true
            }]
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    type: 'time',
                    time: {
                        unit: 'day',
                        tooltipFormat: 'll'
                    },
                    grid: {
                        display: false
                    }
                },
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: function (value, index, values) {
                            return '$' + value.toLocaleString();
                        }
                    }
                }
            }
        }
    });
    /*]]>*/
</script>
</body>
</html>
