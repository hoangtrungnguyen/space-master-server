<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common_header(titleKey='inventory.init.title')}"></head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">Initialize Inventory for <span th:text="${productVariant.sku}"></span></h1>

        <form th:action="@{/inventory/adjust}" th:object="${adjustmentForm}" method="post">
            <input type="hidden" th:field="*{productVariantId}" />
            <input type="hidden" th:field="*{type}" />

            <div class="mb-4">
                <label for="quantity" class="block text-gray-700 text-sm font-bold mb-2">Initial Quantity:</label>
                <input type="number" id="quantity" th:field="*{quantity}" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required min="0" />
            </div>

            <div class="mb-6">
                <label for="notes" class="block text-gray-700 text-sm font-bold mb-2">Notes:</label>
                <textarea id="notes" th:field="*{notes}" rows="3" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="e.g., Initial stock count"></textarea>
            </div>

            <div class="flex items-center justify-between">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                    Set Initial Quantity
                </button>
                <a th:href="@{/inventory}" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
