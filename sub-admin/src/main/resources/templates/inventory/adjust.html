<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: common_header(titleKey='inventory.adjust.title')}"></head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal">

<div th:replace="~{fragments/navigation :: navbar}"></div>

<div class="container mx-auto p-8">

    <!--/* Error Message Alert */-->
    <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6" role="alert">
        <strong class="font-bold">Error!</strong>
        <span class="block sm:inline" th:text="${errorMessage}"></span>
        <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
            <svg onclick="this.parentElement.parentElement.style.display='none';" class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg>
        </span>
    </div>

    <h1 class="text-3xl font-bold mb-6 text-gray-800">Adjust Inventory for <span th:text="${productVariant.sku}"></span></h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Adjustment Form -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <form method="post" th:action="@{/inventory/adjust}" th:object="${adjustmentForm}">
                <input type="hidden" th:field="*{productVariantId}" />

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="quantity">Quantity:</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="quantity" th:field="*{quantity}" required type="number" min="0"/>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="type">Type:</label>
                    <select class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="type" th:field="*{type}">
                        <option value="add">Add / Restock</option>
                        <option value="subtract">Subtract / Adjustment</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="notes">Notes:</label>
                    <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="notes" th:field="*{notes}" rows="4"></textarea>
                </div>

                <div class="flex items-center justify-between">
                    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                        Submit Adjustment
                    </button>
                </div>
            </form>
        </div>

        <!-- Current Inventory -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Current Inventory</h2>
            <div class="text-gray-700" th:if="${inventory != null}">
                <p class="text-lg"><span class="font-semibold">Quantity on Hand:</span> <span class="text-blue-600 font-bold text-xl" th:text="${inventory.quantityOnHand}"></span></p>
                <p class="text-sm mt-2"><span class="font-semibold">Committed:</span> <span th:text="${inventory.quantityCommitted}"></span></p>
                <p class="text-sm"><span class="font-semibold">Reorder Level:</span> <span th:text="${inventory.reorderLevel}"></span></p>
                <p class="text-sm mt-4 text-gray-500">Last Restocked: <span th:text="${inventory.lastRestockedAt != null ? #temporals.format(inventory.lastRestockedAt, 'dd-MMM-yyyy HH:mm') : 'N/A'}"></span></p>
            </div>
            <div class="text-red-500 font-semibold" th:if="${inventory == null}">
                No inventory record exists for this product variant.
            </div>
        </div>
    </div>
</div>

</body>
</html>
