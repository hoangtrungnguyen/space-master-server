<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<h1>Order List</h1>

<table>
    <thead>
    <tr>
        <th>Order ID</th>
        <th>Order Time</th>
        <th>Final Bill</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}">1</td>
        <td th:text="${#dates.format(order.orderTime, 'dd-MM-yyyy HH:mm:ss')}">2023-01-01 10:00:00</td>
        <td th:text="${#numbers.formatCurrency(order.finalBill)}">$100.00</td>
    </tr>
    </tbody>
</table>

</body>
</html>
