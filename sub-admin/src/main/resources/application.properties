spring.application.name=sub-admin
# H2 Database Configuration (File-based)
# This will create a database file in the same directory as your application JAR/EXE
spring.datasource.url=jdbc:sqlite:store.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
# Specify the H2 dialect for Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Optional: Show SQL statements in the console for debugging
spring.jpa.show-sql=true
# Optional: DDL (Data Definition Language) auto-generation strategy
# 'update' will update the schema if it changes, 'create' will create it on startup,
# 'create-drop' will create and then drop on shutdown, 'validate' will validate the schema,
# and 'none' (recommended for production) will do nothing.
spring.jpa.hibernate.ddl-auto=update
