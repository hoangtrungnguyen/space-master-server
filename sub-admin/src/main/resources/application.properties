spring.application.name=sub-admin

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ===================================================================
# DATABASE CONNECTION SETTINGS
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5439/sub_admin_db
spring.datasource.username=postgres
spring.datasource.password=postgres


# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================


# Show the SQL statements generated by Hibernate in the console.
spring.jpa.show-sql=true

# Strategy for creating/updating the database schema.
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=update

# Use Hypersistence Spring-aware factory to resolve custom ID generators like 'tsidGenerator'
spring.jpa.properties.hibernate.id.factory.class=io.hypersistence.utils.hibernate.id.factory.spi.SpringAwareIdentifierGeneratorFactory