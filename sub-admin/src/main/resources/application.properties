spring.application.name=sub-admin
# --- H2 Database Configuration ---
# Persist data to a file in the 'data' directory relative to the application's root.
# This ensures data is not lost when the application restarts.
#spring.datasource.url=jdbc:h2:file:./data/sub-admin-db
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=sa

# Specify the H2 dialect for Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# --- HSQLDB Server Mode ---
# Connect to the HSQLDB server running within the application.
spring.datasource.url=jdbc:hsqldb:hsql://localhost/sub-admin-db
# --- HSQLDB File Mode (Old) ---
#spring.datasource.url=jdbc:hsqldb:file:./data/sub-admin-db;hsqldb.lock_file=false
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect

# Optional: Show SQL statements in the console for debugging
spring.jpa.show-sql=true

# Optional: DDL (Data Definition Language) auto-generation strategy
# 'update' will update the schema if it changes, 'create' will create it on startup,
# 'create-drop' will create and then drop on shutdown, 'validate' will validate the schema,
# and 'none' (recommended for production) will do nothing.
spring.jpa.hibernate.ddl-auto=update
spring.messages.basename=messages
spring.messages.encoding=UTF-8
