ktor:
  application:
    modules:
      - com.space.ApplicationKt.module
  deployment:
    port: 8080

#postgres:
#  url: "jdbc:postgresql://localhost:5439/whiteboard"
#  user: postgres
#  password: postgres

kafka:
  schema:
    registry:
      url:
        - ${KAFKA_SCHEMA_REGISTRY_URL:http://localhost:8081}
  common:
    bootstrap:
      servers:
        - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    client:
      id: "api-gateway-server"
    # Additional attributes
  topics:
    - name: server-operation-topic
      configs:
        message.timestamp.type: CreateTime
        # Additional attributes
  clientId: "api-gateway-client"

services:
  sync_server_url: "http://localhost:9099"