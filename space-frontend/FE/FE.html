<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Space Board - Canvas Client</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .log-entry {
            word-break: break-all;
        }
        .tool-btn.active {
            background-color: #4f46e5;
            color: white;
        }
        /* Simple styling for the color picker */
        #color-picker {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        #color-picker::-webkit-color-swatch {
            border-radius: 50%;
            border: 2px solid #e2e8f0;
        }
        #color-picker::-moz-color-swatch {
            border-radius: 50%;
            border: 2px solid #e2e8f0;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

<div class="flex flex-col lg:flex-row h-screen">
    <!-- Controls and Logs Panel -->
    <div class="w-full lg:w-1/3 p-6 bg-white shadow-lg overflow-y-auto">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Idea Space Board</h1>
            <p class="text-sm text-gray-500">Canvas WebSocket Test Client</p>
        </div>

        <!-- Connection Controls -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3 border-b pb-2">Connection</h2>
            <div class="space-y-4">
                <div>
                    <label for="socket-url" class="block text-sm font-medium text-gray-700">WebSocket URL</label>
                    <input type="text" id="socket-url" value="ws://localhost:8080/ws/documents/70886c73-71cf-4e76-8787-f284ccb25dd0" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="flex items-center space-x-3">
                    <button id="connect-btn" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">Connect</button>
                    <button id="disconnect-btn" class="w-full bg-red-600 text-white py-2 px-4 rounded-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition" disabled>Disconnect</button>
                </div>
                <div id="status" class="text-sm font-medium text-center p-2 rounded-md bg-gray-200 text-gray-700">Status: Disconnected</div>
            </div>
        </div>

        <!-- Session Identifiers -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3 border-b pb-2">Identifiers</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="user-id" class="block text-sm font-medium text-gray-700">User ID</label>
                    <input type="number" id="user-id" value="101" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="session-id" class="block text-sm font-medium text-gray-700">Session ID</label>
                    <input type="number" id="session-id" value="1" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="client-id" class="block text-sm font-medium text-gray-700">Client ID</label>
                    <input type="number" id="client-id" value="1" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
            </div>
        </div>

        <!-- Message Log -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3 border-b pb-2">Message Log</h2>
            <div id="log" class="h-48 bg-gray-50 p-3 rounded-md overflow-y-auto text-xs space-y-2 border">
                <p class="text-gray-400">Messages will appear here...</p>
            </div>
            <button id="clear-log-btn" class="mt-3 w-full bg-gray-200 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition">Clear Log</button>
        </div>

        <!-- Drawing Tools -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3 border-b pb-2">Drawing Tools</h2>
            <div class="flex items-center gap-4">
                <div id="tools" class="flex flex-wrap gap-2">
                    <button class="tool-btn active" data-tool="path">Path</button>
                    <button class="tool-btn" data-tool="line">Line</button>
                    <button class="tool-btn" data-tool="rectangle">Rectangle</button>
                    <button class="tool-btn" data-tool="circle">Circle</button>
                </div>
                <div>
                    <label for="color-picker" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                    <input type="color" id="color-picker" value="#000000">
                </div>
            </div>
        </div>

    </div>

    <!-- Canvas Area -->
    <div class="w-full lg:w-2/3 p-4 flex items-center justify-center bg-gray-200">
        <canvas id="canvas" class="bg-white rounded-lg shadow-md cursor-crosshair w-full h-full"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const connectBtn = document.getElementById('connect-btn');
    const disconnectBtn = document.getElementById('disconnect-btn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const clearLogBtn = document.getElementById('clear-log-btn');
    const toolsDiv = document.getElementById('tools');
    const colorPicker = document.getElementById('color-picker');

    let socket;
    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentPath = [];
    let currentTool = 'path';
    let currentColor = '#000000';
    let processId = null;

    // --- Canvas Setup ---
    function resizeCanvas() {
        const container = canvas.parentElement;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ctx.strokeStyle = currentColor; // Use the selected color
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- Drawing Logic ---
    canvas.addEventListener('mousedown', (e) => {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            logMessage('Please connect to the WebSocket server first.', 'text-red-600 font-bold');
            return;
        }
        isDrawing = true;
        ctx.strokeStyle = currentColor; // Ensure current color is used
        [startX, startY] = [e.offsetX, e.offsetY];
        if (currentTool === 'path') {
            currentPath = [{ x: startX, y: startY }];
        }
    });

    canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        if (currentTool === 'path') {
            ctx.beginPath();
            ctx.moveTo(currentPath[currentPath.length - 1].x, currentPath[currentPath.length - 1].y);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            currentPath.push({ x: e.offsetX, y: e.offsetY });
        }
    });

    canvas.addEventListener('mouseup', (e) => {
        if (!isDrawing) return;
        isDrawing = false;

        let operationPayload;
        switch(currentTool) {
            case 'path':
                operationPayload = { type: 'PATH', value: { points: currentPath, color: currentColor, lineWidth: ctx.lineWidth } };
                break;
            case 'line':
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.stroke();
                operationPayload = { type: 'LINE', value: { start: {x: startX, y: startY}, end: {x: e.offsetX, y: e.offsetY}, color: currentColor, lineWidth: ctx.lineWidth } };
                break;
            case 'rectangle':
                const width = e.offsetX - startX;
                const height = e.offsetY - startY;
                ctx.strokeRect(startX, startY, width, height);
                operationPayload = { type: 'RECTANGLE', value: { x: startX, y: startY, width, height, color: currentColor, lineWidth: ctx.lineWidth } };
                break;
            case 'circle':
                const radius = Math.sqrt(Math.pow(e.offsetX - startX, 2) + Math.pow(e.offsetY - startY, 2));
                ctx.beginPath();
                ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                ctx.stroke();
                operationPayload = { type: 'CIRCLE', value: { cx: startX, cy: startY, radius, color: currentColor, lineWidth: ctx.lineWidth } };
                break;
        }

        if (operationPayload) {
            sendOperation(operationPayload);
        }
        currentPath = [];
    });

    // --- WebSocket Logic ---
    function connect() {
        const url = document.getElementById('socket-url').value;
        if (!url) {
            logMessage('WebSocket URL cannot be empty.', 'text-red-600 font-bold');
            return;
        }

        socket = new WebSocket(url);

        socket.onopen = () => {
            processId = Date.now(); // Create process_id on successful connection
            updateStatus('Connected', 'bg-green-100', 'text-green-800');
            logMessage(`Socket opened successfully. Process ID: ${processId}`, 'text-green-600');
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
        };

        socket.onmessage = (event) => {
            logMessage(`⬇️ RECV: ${event.data}`, 'text-blue-600');
            // Add logic here to draw incoming operations from other users
        };

        socket.onclose = () => {
            processId = null; // Reset process_id
            updateStatus('Disconnected', 'bg-gray-200', 'text-gray-700');
            logMessage('Socket closed.', 'text-red-600');
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
            socket = null;
        };

        socket.onerror = (error) => {
            logMessage(`Error: ${error.message || 'An unknown error occurred.'}`, 'text-red-600 font-bold');
            updateStatus('Error', 'bg-red-100', 'text-red-800');
        };
    }

    function disconnect() {
        if (socket) {
            socket.close();
        }
    }

    function sendOperation(payload) {
        if (!socket || socket.readyState !== WebSocket.OPEN || !processId) {
            logMessage('Cannot send operation: No active connection or process ID missing.', 'text-yellow-600');
            return;
        }

        const userId = parseInt(document.getElementById('user-id').value);
        const sessionId = parseInt(document.getElementById('session-id').value);
        const clientId = parseInt(document.getElementById('client-id').value);

        const operation = {
            // doc_id is no longer sent from the client
            sync_op: "EDIT_DOC",
            process_id: processId,
            user_id: userId,
            session_id: sessionId,
            window_id: clientId,
            payload: {
                element_op: "ADD_ELEMENT",
                element: {
                    uuid: crypto.randomUUID(),
                    parent_uuid: null,
                    metadata: { timestamp: new Date().toISOString() },
                    ...payload
                }
            }
        };

        const message = JSON.stringify(operation);
        socket.send(message);
        logMessage(`⬆️ SENT: ${message}`, 'text-purple-600');
    }

    // --- UI Helpers ---
    function updateStatus(text, bgColor, textColor) {
        statusDiv.textContent = `Status: ${text}`;
        statusDiv.className = `text-sm font-medium text-center p-2 rounded-md ${bgColor} ${textColor}`;
    }

    function logMessage(message, colorClass = 'text-gray-800') {
        if (logDiv.children.length === 1 && logDiv.firstElementChild.textContent.includes('will appear here')) {
            logDiv.innerHTML = '';
        }
        const entry = document.createElement('p');
        entry.className = `log-entry ${colorClass}`;
        entry.textContent = message;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function clearLog() {
        logDiv.innerHTML = '<p class="text-gray-400">Messages will appear here...</p>';
    }

    function selectTool(e) {
        if (e.target.tagName === 'BUTTON') {
            toolsDiv.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');
            currentTool = e.target.dataset.tool;
        }
    }

    function changeColor(e) {
        currentColor = e.target.value;
        ctx.strokeStyle = currentColor;
    }

    // --- Event Listeners ---
    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    clearLogBtn.addEventListener('click', clearLog);
    toolsDiv.addEventListener('click', selectTool);
    colorPicker.addEventListener('input', changeColor);


    // Style tool buttons
    toolsDiv.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.add('px-4', 'py-2', 'border', 'rounded-md', 'bg-white', 'hover:bg-gray-100', 'transition');
    });

</script>
</body>
</html>
